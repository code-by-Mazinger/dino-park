<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7ec8e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дино-парк">
<title>Дино-парк</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#2b2118;--leaf:#2f8f4e;--orange:#ff8a1f;--sand:#e9c98f;--card:#fffaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;background:#7ec8e3}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.scr{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh}
.scr[hidden]{display:none}
/* парк */
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
#dinos{position:absolute;inset:0}
.pd{position:absolute;left:0;bottom:0;transform-origin:50% 100%;cursor:pointer}
.pd img,.di{display:block;width:100%;height:auto;-webkit-user-drag:none;pointer-events:none}
.pd{-webkit-touch-callout:none}
.pd .flip{transform-origin:50% 100%}
.pd.walk img{transform-origin:50% 100%;animation:waddle .42s ease-in-out infinite alternate}
@keyframes waddle{from{transform:rotate(-1.6deg) translateY(0)}to{transform:rotate(1.6deg) translateY(-3%)}}
.pd.fly img{animation:glide 1.4s ease-in-out infinite alternate}
@keyframes glide{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-14%) rotate(2deg)}}
.di.fossil{filter:grayscale(1) sepia(.35) brightness(1.5) contrast(.75) drop-shadow(0 2px 2px rgba(80,50,20,.5))}
.di.shadow{filter:brightness(0) opacity(.78)}
.pd.new .flip{animation:pop .9s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(0)}}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;text-align:center;pointer-events:none}
#top h1{margin:0;font-size:clamp(30px,9vw,44px);font-weight:900;color:#fff;letter-spacing:.02em;text-shadow:0 3px 0 #2f8f4e,0 6px 14px rgba(0,0,0,.25)}
#hello{margin-top:2px;font-weight:800;color:#fff;font-size:17px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
#count{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.85);font-weight:900;font-size:16px}
#digBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:min(92vw,420px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:26px;
  background:linear-gradient(180deg,#ffb347,#ff7a1a);color:#fff;font-weight:900;font-size:22px;box-shadow:0 6px 0 #c4520a,0 12px 24px rgba(0,0,0,.25)}
#digBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #c4520a}
#digBtn .q{width:84px;height:56px;flex:none;display:flex;align-items:flex-end;justify-content:center;background:rgba(255,255,255,.25);border-radius:14px;padding:4px}
#digBtn .q img{max-width:100%;max-height:100%;width:auto;height:auto}
#digBtn small{display:block;font-size:14px;font-weight:700;opacity:.9}
#belt{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-weight:800;font-size:14px}
#belt i{width:34px;height:10px;border-radius:3px;border:1.5px solid rgba(0,0,0,.35)}
#sambo{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom) + 112px);display:flex;align-items:flex-end;gap:8px;z-index:30}
#egg{width:70px;height:84px;background:none;padding:0}
#egg svg{width:100%;height:100%;overflow:visible}
#egg.wob svg{animation:wob 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
#trainBtn{padding:10px 14px;border-radius:18px;background:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-bottom:6px}
#hPic{height:150px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#fff3d6,#e9f7d8);border-radius:20px}
#hPic img{max-height:140px;width:100%;height:auto;object-fit:contain}
#hPic.crack svg{animation:wob .6s ease-in-out 3}
#gate{align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 14px)}
.toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:40;padding:14px 18px;border-radius:18px;background:rgba(43,33,24,.9);color:#fff;font-weight:800;font-size:18px;text-align:center;max-width:86vw}
#games{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 112px);display:flex;gap:8px;z-index:30}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;padding:8px 4px 6px;border-radius:18px;background:#fff;font-weight:900;font-size:12px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.gbtn b{font-size:28px;line-height:1}
.game{background:#7ec8e3 url(park.jpg) 50% 100%/cover}
.gtop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:5}
.gpill{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.9);font-weight:900;font-size:19px}
.link{background:none;font-weight:800;font-size:18px;color:#2f8f4e}
/* голодный динозавр */
#falls{position:absolute;inset:0;z-index:3;overflow:hidden}
.fc{position:absolute;min-width:78px;height:64px;padding:0 14px;border-radius:20px;background:#fffaf0;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #c9a26a,0 8px 16px rgba(0,0,0,.2);transform:translate(-50%,0)}
.fc::before{content:"🍃";position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-20deg);font-size:20px}
.fc.no{animation:no .4s}
.fc.eat{transition:left .45s ease-in,top .45s ease-in,transform .45s ease-in,opacity .45s;transform:translate(-50%,0) scale(.2);opacity:.2}
#eater{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);width:min(62vw,300px);transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center}
#eaterImg{width:100%}
#eater.nope #eaterImg img{animation:no .45s}
#hWant{position:relative;margin-bottom:12px;padding:10px 18px;border-radius:22px;background:#fffaf0;font-weight:900;font-size:clamp(24px,7vw,32px);box-shadow:0 6px 16px rgba(0,0,0,.25);white-space:nowrap}
#hWant::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-bottom:0;border-top-color:#fffaf0}
#hWant b{color:#d64535;letter-spacing:.03em}
#hHand{position:absolute;z-index:6;font-size:54px;pointer-events:none;transform:translate(-30%,10%);animation:tap .9s ease-in-out infinite}
#hHand[hidden]{display:none}
@keyframes tap{50%{transform:translate(-30%,-10%) scale(.9)}}
#eater img{width:100%;display:block;transform-origin:70% 90%}
#eater.chomp img{animation:chomp .35s ease-in-out 2}
@keyframes chomp{50%{transform:scale(1.08,0.94) rotate(-3deg)}}
#hDone,#pDone{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,40,20,.4)}
#hDone[hidden],#pDone[hidden]{display:none}
/* профессор */
#pBox{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:12px;z-index:3}
#pWho{display:flex;align-items:flex-end;justify-content:space-between}
#pFace{font-size:88px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));transition:transform .3s}
#pFace.oops{transform:rotate(-12deg) scale(1.1)}
#pDino{width:55%;max-height:150px;display:flex;justify-content:flex-end}
#pDino img{max-height:150px;width:auto;max-width:100%}
.bubble{position:relative;padding:16px 16px 12px;border-radius:24px;background:#fffaf0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bubble::before{content:"";position:absolute;left:34px;top:-14px;border:14px solid transparent;border-top:0;border-bottom-color:#fffaf0}
#pText{font-size:clamp(22px,6.4vw,28px);font-weight:900;line-height:1.3}
#pSay{margin-top:10px;padding:8px 14px;border-radius:14px;background:#ffe9c2;font-weight:800;font-size:16px}
#pAns{display:flex;gap:10px;margin-top:auto}
.ans{flex:1;padding:18px 6px;border-radius:22px;font-weight:900;font-size:22px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.ans.yes{background:linear-gradient(#5fd36f,#2f8f4e)}.ans.no{background:linear-gradient(#ff7b6b,#d64535)}
.ans:active{transform:translateY(4px)}
#pFeed{margin-top:auto;padding:14px;border-radius:22px;background:rgba(255,250,240,.96);text-align:center}
#pFeed[hidden]{display:none}
#pFeedText{font-size:20px;font-weight:800;line-height:1.35;margin-bottom:10px}
#sign{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 2px);font-size:10px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.1em}
/* раскопки */
#dig{background:#e9b77a url(dig.jpg) 50% 50%/cover;display:flex;flex-direction:column}
#digTop{position:relative;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;align-items:center;gap:10px;z-index:3;flex:none}
.round{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.9);font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.2);flex:none}
#digHint{flex:0 1 auto;padding:7px 14px;border-radius:16px;background:rgba(45,28,12,.55);color:#fff;font-weight:900;font-size:19px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
#pit{position:relative;flex:none;margin:0 7%;height:min(34dvh,72vw);border-radius:26px;background:radial-gradient(120% 100% at 50% 40%,#c48d52,#9a6a3a);box-shadow:inset 0 10px 26px rgba(70,40,15,.55),0 0 0 3px rgba(255,236,200,.35);overflow:hidden}
#fossil{position:absolute;inset:6%;display:flex;align-items:center;justify-content:center}
#fossil img{max-width:100%;max-height:100%;width:auto;height:auto;transition:filter .6s}
#fossil.glow img{filter:grayscale(1) sepia(.35) brightness(1.5) contrast(.75) drop-shadow(0 0 14px #fff6c8)}
#fossil.alive img{animation:pop .9s cubic-bezier(.3,1.6,.6,1)}
#sand{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .8s}
#bar{position:relative;flex:none;margin:12px 12% 8px;height:12px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe28a,#ffb347);transition:width .2s}
/* сборка имени */
.di.sil{filter:brightness(0) opacity(.35)}
.di.outline{filter:grayscale(1) brightness(.85) contrast(1.6) opacity(.6)}
#task{position:relative;flex:1;min-height:0;overflow-y:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(rgba(45,28,12,0),rgba(45,28,12,.55) 18%);display:flex;flex-direction:column;align-items:center;gap:10px}
#task[hidden]{display:none}
#taskTitle{color:#fff;font-weight:900;font-size:20px;text-shadow:0 2px 4px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px}
#say{width:52px;height:52px;border-radius:50%;background:#fff;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{min-width:58px;height:52px;padding:0 8px;border-radius:14px;border:3px dashed rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:25px;color:#fff}
.slot.cur{border-color:#ffe28a;box-shadow:0 0 0 4px rgba(255,226,138,.35)}
.slot.ok{background:#fff6dc;border:3px solid #ffb347;color:var(--ink)}
#tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:440px}
.tile{min-width:64px;height:56px;padding:0 12px;border-radius:16px;background:var(--card);font-weight:900;font-size:27px;box-shadow:0 5px 0 #c9a26a;letter-spacing:.02em}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #c9a26a}
.tile.used{visibility:hidden}
.tile.no{animation:no .4s}
@keyframes no{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tile.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.12);box-shadow:0 0 0 5px #ffe28a,0 5px 0 #c9a26a}}
#done{position:absolute;left:0;right:0;bottom:0;padding:24px 16px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(rgba(45,28,12,0),rgba(45,28,12,.55) 25%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
#done[hidden]{display:none}
#doneName{font-size:clamp(34px,10vw,50px);font-weight:900;color:#fff;text-shadow:0 3px 0 #c4520a,0 6px 12px rgba(0,0,0,.3)}
#donePraise{font-size:22px;font-weight:900;color:#ffe28a;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.go{padding:16px 28px;border-radius:24px;background:linear-gradient(180deg,#5fd36f,#2f8f4e);color:#fff;font-weight:900;font-size:22px;box-shadow:0 6px 0 #1f6234}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1f6234}
.leaf{position:fixed;pointer-events:none;font-size:26px;z-index:20;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
/* карточка динозавра */
.ovl{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,40,20,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ovl[hidden]{display:none}
.card{width:min(440px,94vw);max-height:calc(100dvh - 32px);overflow:auto;border-radius:28px;background:var(--card);padding:16px 18px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#cPic{height:140px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#d8f0ff,#e9f7d8);border-radius:20px}
#cPic img{max-width:96%;max-height:130px;width:auto;height:auto}
#cName{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:12px 0 4px}
#cName button{padding:6px 10px;border-radius:12px;background:#ffe9c2;font-weight:900;font-size:26px}
#cName .all{background:#ffb347;color:#fff;font-size:22px}
#cType{font-weight:800;color:#6b5a48;margin:4px 0 8px}
.fact{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0;padding:10px 12px;border-radius:16px;background:#f3ead8;text-align:left;font-size:19px;font-weight:700;line-height:1.3}
.fact b{font-size:24px;flex:none}
.fld{display:block;width:100%;margin:10px 0;padding:14px;border-radius:16px;border:3px solid #e8d6b3;background:#fff;font:inherit;font-size:24px;font-weight:800;text-align:center;-webkit-user-select:text;user-select:text}
.big{font-size:64px;line-height:1.1}
h2{margin:6px 0;font-size:26px}
</style>
</head>
<body>
<div class="scr" id="park">
  <img id="bg" src="park.jpg" alt="">
  <div id="dinos"></div>
  <div id="top"><h1>Дино-парк</h1><div id="hello"></div><div id="count"></div><div id="belt"></div></div>
  <div id="sambo"><button id="egg" aria-label="Яйцо динозавра"></button><button id="trainBtn">🥋 Самбо</button></div>
  <div id="games"><button class="gbtn" id="hungryBtn"><b>🍖</b>Голодный</button><button class="gbtn" id="profBtn"><b>🧑‍🔬</b>Профессор</button></div>
  <button id="digBtn"><span class="q" id="digQ"></span><span>🦴 На раскопки<small id="digSub">Кто прячется в земле?</small></span></button>
  <div id="sign">code-by-Mazinger</div>
</div>

<div class="scr" id="dig" hidden>
  <div id="digTop"><button class="round" id="digBack" aria-label="В парк">🌴</button><div id="digHint">Счищай песок пальцем!</div></div>
  <div id="bar"><i></i></div>
  <div id="pit"><div id="fossil"></div><canvas id="sand"></canvas></div>
  <div id="task" hidden>
    <div id="taskTitle"><button id="say" aria-label="Послушать слог">🔊</button><span>Собери имя!</span></div>
    <div id="slots"></div>
    <div id="tiles"></div>
  </div>
  <div id="done" hidden>
    <div id="doneName"></div>
    <div id="donePraise"></div>
    <button class="go" id="toPark">В парк! 🌴</button>
  </div>
</div>

<div class="scr game" id="hungry" hidden>
  <div class="gtop"><button class="round" id="hBack" aria-label="В парк">🌴</button><div class="gpill" id="hScore"></div><button class="round" id="hSay" aria-label="Послушать слог">🔊</button></div>
  <div id="falls"></div>
  <div id="eater"><button id="hWant"></button><div id="eaterImg"></div></div>
  <div id="hHand" hidden>👆</div>
  <div id="hDone" hidden><div class="card"><div class="big">😋</div><h2>Динозавр наелся!</h2><p id="hDoneText" style="font-size:19px;font-weight:700"></p><button class="go" id="hAgain">Ещё раз</button><p><button class="link" id="hHome">В парк 🌴</button></p></div></div>
</div>

<div class="scr game" id="prof" hidden>
  <div class="gtop"><button class="round" id="pBack" aria-label="В парк">🌴</button><div class="gpill" id="pScore"></div></div>
  <div id="pBox">
    <div id="pWho"><span id="pFace">🧑‍🔬</span><div id="pDino"></div></div>
    <div class="bubble"><div id="pText"></div><button id="pSay">🔊 Послушать</button></div>
    <div id="pAns"><button class="ans yes" id="pYes">✅ Верно</button><button class="ans no" id="pNo">❌ Ошибка!</button></div>
    <div id="pFeed" hidden><div id="pFeedText"></div><button class="go" id="pNext">Дальше ▶</button></div>
  </div>
  <div id="pDone" hidden><div class="card"><div class="big">🎓</div><h2 id="pDoneTitle"></h2><p id="pDoneText" style="font-size:19px;font-weight:700"></p><button class="go" id="pAgain">Ещё раз</button><p><button class="link" id="pHome">В парк 🌴</button></p></div></div>
</div>

<div class="ovl" id="card" hidden><div class="card">
  <div id="cPic"></div>
  <div id="cName"></div>
  <div id="cType"></div>
  <div id="cFacts"></div>
  <button class="go" id="cClose">Готово</button>
</div></div>

<div class="ovl" id="gate" hidden><div class="card">
  <div style="font-size:40px">🥋</div>
  <h2>Для взрослых</h2>
  <p style="font-size:18px;font-weight:700">Отметить тренировку по самбо. Сколько будет <span id="gQ"></span>?</p>
  <input class="fld" id="gIn" type="number" inputmode="numeric" autocomplete="off">
  <div id="gErr" style="color:#c0392b;font-weight:800;min-height:22px"></div>
  <div style="display:flex;gap:10px;justify-content:center"><button class="go" id="gOk">Отметить</button><button class="go" id="gNo" style="background:linear-gradient(#cfc4b2,#a99c86);box-shadow:0 6px 0 #857a66">Отмена</button></div>
</div></div>

<div class="ovl" id="hatch" hidden><div class="card">
  <div id="hPic"></div>
  <h2 id="hTitle"></h2>
  <p id="hText" style="font-size:19px;font-weight:700"></p>
  <button class="go" id="hOk">Ура! 🦖</button>
</div></div>

<div class="ovl" id="hi" hidden><div class="card">
  <div class="big">🦖</div>
  <h2>Привет, палеонтолог!</h2>
  <p style="font-size:19px;font-weight:700">Как тебя зовут?</p>
  <input class="fld" id="nameIn" maxlength="14" autocomplete="off" placeholder="Имя">
  <button class="go" id="nameOk">Начать! 🦴</button>
</div></div>

<script src="data.js"></script>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
